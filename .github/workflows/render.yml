name: Overnight video render

on:
  schedule:
    # 20:07 UTC is 1:37 AM the following day in India.
    - cron: '7 20 * * *'
  workflow_dispatch:
    inputs:
      job:
        description: 'Existing job id (blank: process queued jobs)'
        type: string
        default: ''
      force:
        description: 'Render even if this job already completed'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: overnight-video-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VIDEO_CODE_MODE: authored
    steps:
      - name: Check out video jobs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - name: Restore completion markers
        id: state
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .state/rendered.json
          key: video-state-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: video-state-v1-${{ github.ref_name }}-

      - name: Find pending jobs
        id: plan
        env:
          INPUT_JOB: ${{ inputs.job }}
          INPUT_FORCE: ${{ inputs.force }}
        run: node src/queue.mjs --plan

      - name: Build isolated FFmpeg renderer
        if: steps.plan.outputs.pending != '0'
        run: docker build --tag overnight-video:local .

      - name: Render up to three authored JavaScript videos
        id: render
        if: steps.plan.outputs.work_required == 'true'
        env:
          INPUT_JOB: ${{ inputs.job }}
          INPUT_FORCE: ${{ inputs.force }}
        run: node src/queue.mjs

      # Save successful completion markers even if another scene failed.
      - name: Save completion markers
        if: always() && steps.render.outputs.state_changed == 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .state/rendered.json
          key: video-state-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload finished videos and render reports
        if: always() && steps.plan.outputs.work_required == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: finished-videos-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0
